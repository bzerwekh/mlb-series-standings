name: Build and publish standings

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build"
        default: "2026"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standings from statsapi.mlb.com
        run: python3 build.py --refresh --season "${{ inputs.season || '2026' }}"

      - name: Stage site
        run: |
          mkdir -p _site
          cp standings.html _site/index.html
          cp -r images _site/images

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
